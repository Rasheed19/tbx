[project]
name = "tbx"
version = "0.1.0"
description = "Toolbox for various i/o operations built for my day-to-day needs."
readme = "README.md"
authors = [
    { name = "Rasheed19", email = "ibraheem.abdulrasheed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click==8.3.1",
    "pyfiglet==1.0.4",
]

[project.scripts]
tbx = "tbx.cli:cli"

[project.optional-dependencies]
tests = [
    "pytest>=9.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbx"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/tests",
  "/data",
]

[tool.pyright]
typeCheckingMode = "off"
